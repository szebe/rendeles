<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2338F5">
<title>SupaClean – Anyagigény</title>
<link rel="icon" href="favicon.png">
<style>
  :root { --cobalt:#2338F5; --teal:#1FD1BF; --teal-d:#0E9F90; --ink:#0B1B2B; --muted:#64748B; --line:#E2E8F0; --bg:#F4F6FB; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--cobalt); color:#fff; padding:18px 18px 22px; position:relative; overflow:hidden; }
  header::after { content:""; position:absolute; left:0; right:0; bottom:0; height:5px; background:var(--teal); }
  header .brand { font-weight:900; letter-spacing:.5px; font-size:15px; opacity:.9; }
  header h1 { margin:6px 0 0; font-size:24px; font-weight:800; }
  main { padding:14px 14px 130px; max-width:640px; margin:0 auto; }
  .label { font-size:14px; font-weight:700; color:#334155; margin:18px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:#fff; color:#334155; border-radius:22px; padding:10px 15px; font-size:15px; font-weight:600; }
  .chip.on { background:var(--cobalt); border-color:var(--cobalt); color:#fff; }
  .search { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px; font-size:16px; background:#fff; }
  .cat { font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--teal-d); margin:16px 0 6px; }
  .prod { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:9px 12px; margin-bottom:6px; }
  .prod.on { border-color:var(--cobalt); background:#EEF0FF; }
  .prod .n { flex:1; } .prod .n b { display:block; font-size:16px; font-weight:600; } .prod .n small { color:var(--muted); }
  .step { width:42px; height:42px; border-radius:11px; border:1px solid var(--cobalt); background:#fff; color:var(--cobalt); font-size:24px; font-weight:700; line-height:1; }
  .step.plus { background:var(--cobalt); color:#fff; }
  .qty { min-width:28px; text-align:center; font-size:19px; font-weight:800; color:var(--cobalt); }
  textarea { width:100%; min-height:80px; padding:12px; border:1px solid var(--line); border-radius:12px; font-size:16px; font-family:inherit; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); background:rgba(244,246,251,.96); border-top:1px solid var(--line); }
  .send { display:block; width:100%; max-width:640px; margin:0 auto; border:0; border-radius:14px; background:var(--cobalt); color:#fff; font-size:17px; font-weight:800; padding:16px; }
  .send:disabled { opacity:.45; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:10px; }
  .center { text-align:center; padding:40px 20px; }
  .big { font-size:56px; } .muted { color:var(--muted); } .err { color:#B91C1C; }
  .hist { font-size:14px; } .hist b { display:block; font-size:15px; }
  .st { display:inline-block; border-radius:8px; padding:2px 8px; font-size:12px; font-weight:700; color:#fff; margin-left:6px; }
  .st.uj { background:#F59E0B; } .st.kiszallitva { background:#10B981; }
  .link { background:none; border:0; color:#DC2626; font-weight:700; padding:6px 0; font-size:14px; }
  .ghost { background:#fff; color:var(--cobalt); border:2px solid var(--cobalt); }
</style>
</head>
<body>
<header><div class="brand">SUPACLEAN</div><h1 id="hello">Anyagigény</h1></header>
<main id="app"><div class="center muted">Betöltés…</div></main>
<div class="bar" id="bar" hidden><button class="send" id="send" disabled>Igény leadása</button></div>
<script>
const SUPABASE_URL = 'https://phonsamuiotwuthsbsxt.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBob25zYW11aW90d3V0aHNic3h0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2Nzc1NjYsImV4cCI6MjExMDI1MzU2Nn0.iGdtmc9yLMKTOASvKUCeXEmXR5SLxeC93a3lpZUDyPI';
const CATS = ['Vegyszer', 'Eszköz', 'Szemeteszsák', 'Papíráru', 'Egyéb'];

// A kód a link # utáni részében van (nem kerül a szerver naplóiba); régi ?k= formátum is működik
const params = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
const token = params.get('k') || '';
let data = null, customer = null, qty = {}, q = '', note = '', sending = false;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

async function rpc(fn, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: ANON, Authorization: `Bearer ${ANON}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const j = await res.json().catch(() => null);
  if (!res.ok) throw new Error((j && (j.message || j.hint)) || `Hiba (${res.status})`);
  return j;
}

function fail(msg) {
  $('bar').hidden = true;
  $('app').innerHTML = `<div class="center"><div class="big">⚠️</div><p class="err"><b>${esc(msg)}</b></p>
    <p class="muted">Kérd el Tamástól vagy Lacitól a saját rendelőlinkedet.</p></div>`;
}

async function load() {
  if (!token) return fail('Hiányzik a személyes kód a linkből.');
  try {
    data = await rpc('order_portal', { p_token: token });
  } catch (e) { return fail(e.message); }
  const first = (data.nickname || '').trim() || (data.worker_name || '').trim().split(/\s+/).pop();
  $('hello').textContent = `Szia${first ? ', ' + first : ''}!`;
  if (data.customers.length === 1) customer = data.customers[0].id;
  render();
}

function chosen() { return data.products.filter((p) => (qty[p.id] || 0) > 0); }

function render() {
  const s = q.trim().toLowerCase();
  const list = data.products.filter((p) => !s || p.name.toLowerCase().includes(s));
  const cats = [...CATS, ...new Set(list.map((p) => p.category).filter((c) => !CATS.includes(c)))];
  let h = '';
  h += `<div class="label">Melyik objektumba kell?</div>`;
  if (!data.customers.length) h += `<p class="muted">Nincs hozzád rendelt objektum. Szólj Tamásnak vagy Lacinak.</p>`;
  else h += `<div class="chips">${data.customers.map((c) => `<button class="chip ${customer === c.id ? 'on' : ''}" data-c="${c.id}">${esc(c.name)}</button>`).join('')}</div>`;
  h += `<div class="label">Mire van szükséged?</div><input class="search" id="q" placeholder="Keresés…" value="${esc(q)}">`;
  for (const c of cats) {
    const ps = list.filter((p) => p.category === c);
    if (!ps.length) continue;
    h += `<div class="cat">${esc(c)}</div>`;
    for (const p of ps) {
      const n = qty[p.id] || 0;
      h += `<div class="prod ${n ? 'on' : ''}"><div class="n"><b>${esc(p.name)}</b><small>${esc(p.unit || '')}</small></div>
        ${n ? `<button class="step" data-m="${p.id}">−</button><span class="qty">${n}</span>` : ''}
        <button class="step plus" data-p="${p.id}">+</button></div>`;
    }
  }
  h += `<div class="label">Megjegyzés (nem kötelező)</div><textarea id="note" placeholder="pl. a porszívó zsinórja is kezd tönkremenni">${esc(note)}</textarea>`;
  if (data.recent && data.recent.length) {
    h += `<div class="label">Korábbi igényeim</div>`;
    for (const r of data.recent) {
      const d = new Date(r.created_at).toLocaleString('hu-HU', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      h += `<div class="card hist"><b>${esc(r.customer_name)} <span class="st ${r.status}">${r.status === 'uj' ? 'Leadva' : 'Kiszállítva'}</span></b>
        <span class="muted">${esc(d)}</span><div>${esc(r.items || '')}</div>
        ${r.status === 'uj' ? `<button class="link" data-x="${r.id}">Visszavonás</button>` : ''}</div>`;
    }
  }
  const qFocused = document.activeElement && document.activeElement.id === 'q';
  $('app').innerHTML = h;
  if (qFocused) { const el = $('q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  $('bar').hidden = false;
  const n = chosen().length;
  $('send').textContent = n ? `Igény leadása (${n} tétel)` : 'Igény leadása';
  $('send').disabled = !n || !customer || sending;
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('button'); if (!t || !data) return;
  if (t.dataset.c) { customer = t.dataset.c; render(); }
  else if (t.dataset.p) { qty[t.dataset.p] = (qty[t.dataset.p] || 0) + 1; render(); }
  else if (t.dataset.m) { qty[t.dataset.m] = Math.max(0, (qty[t.dataset.m] || 0) - 1); render(); }
  else if (t.dataset.x) {
    if (!confirm('Visszavonod ezt az igényt?')) return;
    try { await rpc('order_cancel', { p_token: token, p_request: t.dataset.x }); data = await rpc('order_portal', { p_token: token }); render(); }
    catch (err) { alert(err.message); }
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { q = e.target.value; render(); }
  if (e.target.id === 'note') note = e.target.value;
});

$('send').addEventListener('click', async () => {
  if (sending) return;
  sending = true; $('send').disabled = true; $('send').textContent = 'Küldés…';
  try {
    const items = chosen().map((p) => ({ product_id: p.id, qty: qty[p.id] }));
    const id = await rpc('order_submit', { p_token: token, p_customer: customer, p_items: items, p_note: note });
    // Értesítés a felelős vezetőnek (ha nem sikerül, az igény akkor is megvan)
    fetch(`${SUPABASE_URL}/functions/v1/supply-request`, {
      method: 'POST',
      headers: { apikey: ANON, Authorization: `Bearer ${ANON}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ request_id: id, order_token: token }),
    }).catch(() => {});
    const name = data.customers.find((c) => c.id === customer)?.name || '';
    qty = {}; note = ''; q = '';
    $('bar').hidden = true;
    $('app').innerHTML = `<div class="center"><div class="big">✅</div><h2>Köszönjük, megkaptuk!</h2>
      <p class="muted">${esc(name)} – a felelős vezető értesítést kapott, a következő kiszállításkor visszük.</p>
      <button class="send ghost" id="again" style="margin-top:20px">Ha valami lemaradt, itt pótolhatod.</button></div>`;
    $('again').onclick = async () => { data = await rpc('order_portal', { p_token: token }); render(); };
  } catch (err) {
    alert(err.message);
    render();
  } finally { sending = false; }
});

load();
</script>
</body>
</html>
